[project]
name = "readwise-base"
version = "0.1.0"
description = "Build a filesystem-native knowledge base from Readwise Reader."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
readwise-base = "readwise_base.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
